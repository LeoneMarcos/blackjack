name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Check formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Build Docker image with signaling build argument and verify bundle
        run: |
          docker build --build-arg VITE_SIGNALING_URL=wss://signaling.example.invalid -t blackjack-signaling-test .
          docker run --rm blackjack-signaling-test sh -c "grep -rq 'wss://signaling.example.invalid' /usr/share/nginx/html/assets && echo 'Deterministic check passed: VITE_SIGNALING_URL is embedded in container bundle' || (echo 'Deterministic check failed: signaling URL missing from bundle' && exit 1)"
          docker rmi blackjack-signaling-test

      - name: Build and start Docker container
        run: docker compose up -d --build

      - name: Verify Docker container health
        run: |
          for i in $(seq 1 30); do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' blackjack 2>/dev/null || echo "starting")
            if [ "$STATUS" = '"healthy"' ]; then
              echo "Container is healthy!"
              exit 0
            fi
            echo "Waiting for container healthcheck... ($STATUS)"
            sleep 2
          done
          echo "Container failed to become healthy in time"
          docker logs blackjack
          exit 1

      - name: Verify HTTP response
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8083/)
          if [ "$HTTP_CODE" -ne 200 ]; then
            echo "Expected HTTP 200 from root endpoint, got $HTTP_CODE"
            exit 1
          fi
          echo "Received HTTP 200 from root endpoint!"

      - name: Teardown Docker container
        if: always()
        run: docker compose down -v
