name: Stack Sync

on:
  push:
    branches:
      - chore/finalize-canonical-stack
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stack-sync-blackjack-final
  cancel-in-progress: true

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v4
        with:
          ref: chore/finalize-canonical-stack

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Rebuild dependency lock
        run: |
          rm -f package-lock.json
          npm install --package-lock-only --legacy-peer-deps

      - name: Install synchronized dependencies strictly
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Verify formatting
        run: npm run format:check

      - name: Run lint
        run: npm run lint

      - name: Check types
        run: npm run typecheck

      - name: Run unit and component tests
        run: npm test

      - name: Build application
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        run: npm run test:e2e

      - name: Commit validated lockfile
        run: |
          if git diff --quiet package-lock.json; then
            echo "Lockfile already synchronized"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(stack): sync ESLint 10 lockfile"
          git push origin HEAD:chore/finalize-canonical-stack
